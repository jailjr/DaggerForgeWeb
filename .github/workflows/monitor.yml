name: Monitor production API

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  health:
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node ops/monitor-health.js
        env:
          MONITOR_BASE_URL: ${{ secrets.MONITOR_BASE_URL }}
          MONITOR_ALERT_WEBHOOK: ${{ secrets.MONITOR_ALERT_WEBHOOK }}
          MONITOR_ONCE: '1'
