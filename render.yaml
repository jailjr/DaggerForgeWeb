services:
  - type: web
    name: daggerforge-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SERVE_STATIC
        value: "1"
      - key: REQUIRE_PRODUCTION_SERVICES
        value: "1"
      - key: DATABASE_URL
        sync: false
      - key: PUBLIC_APP_URL
        value: https://daggerforgeweb.onrender.com
      - key: CORS_ORIGIN
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: avatars
      - key: SUPABASE_BACKUP_BUCKET
        value: backups
      - key: ENABLE_BACKUPS
        value: "1"
      - key: BACKUP_INTERVAL_MS
        value: "21600000"
      - key: BACKUP_RETENTION
        value: "14"
      - key: SENTRY_DSN
        sync: false
      - key: RATE_LIMIT_MAX
        value: "120"
      - key: RATE_LIMIT_AUTH_MAX
        value: "20"
      - key: RATE_LIMIT_WINDOW_MS
        value: "60000"
      - key: TRUST_PROXY
        value: "1"
